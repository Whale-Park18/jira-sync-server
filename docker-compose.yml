services:
  jira-sync-server:
    build: .
    env_file: .env
    volumes:
      - ${JIRA_SYNC_DIR}:/config:ro
      - ./data:/data
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
