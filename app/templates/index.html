<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Sync</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --border: #e0e4ea;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --error: #dc2626;
      --syncing: #2563eb;
      --text: #111827;
      --text-muted: #6b7280;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Login ── */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }

    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: .9rem;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }

    input[type="password"]:focus { border-color: var(--primary); }

    .error-msg {
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .875rem;
      margin-bottom: 16px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-size: .875rem;
      font-weight: 500;
      padding: 6px 12px;
    }

    .btn-ghost:hover { color: var(--text); }

    /* ── Main layout ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 1.1rem; font-weight: 700; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* ── Sync button ── */
    .sync-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin: 0 auto 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform .1s, background .15s, box-shadow .15s;
      box-shadow: 0 4px 20px rgba(37,99,235,.35);
    }

    .sync-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: scale(1.04);
      box-shadow: 0 6px 24px rgba(37,99,235,.45);
    }

    .sync-btn:active:not(:disabled) { transform: scale(.97); }

    .sync-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .sync-btn svg { width: 40px; height: 40px; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
    }

    .sync-btn.syncing .sync-icon { display: none; }
    .sync-btn.syncing .spinner { display: block; }

    /* ── Status section ── */
    .status-section { margin-top: 8px; }

    .status-label {
      font-size: .8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .825rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .badge-success { background: #dcfce7; color: var(--success); }
    .badge-error   { background: #fee2e2; color: var(--error); }
    .badge-syncing { background: #dbeafe; color: var(--syncing); }
    .badge-none    { background: var(--bg); color: var(--text-muted); }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .syncing-dot { animation: pulse 1s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    .last-time {
      font-size: .9rem;
      color: var(--text-muted);
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2937;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: .875rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .card, .login-card { padding: 28px 20px; }
      .sync-btn { width: 140px; height: 140px; }
    }
  </style>
</head>
<body>

{% if page == "login" %}
<!-- ── Login Page ─────────────────────────────────────────── -->
<div class="login-wrap">
  <div class="login-card">
    <h1>Jira Sync</h1>
    <p>계속하려면 비밀번호를 입력하세요.</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autofocus required />
      </div>
      <button type="submit" class="btn btn-primary">로그인</button>
    </form>
  </div>
</div>

{% else %}
<!-- ── Main Page ──────────────────────────────────────────── -->
<header>
  <h1>Jira Sync</h1>
  <form method="post" action="/logout">
    <button type="submit" class="btn btn-ghost">로그아웃</button>
  </form>
</header>

<main>
  <div class="card">
    <button class="sync-btn" id="syncBtn" onclick="triggerSync()">
      <svg class="sync-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      <div class="spinner"></div>
      <span class="sync-btn-label">동기화 실행</span>
    </button>

    <div class="status-section">
      <div class="status-label">마지막 동기화</div>
      <div id="statusBadge" class="status-badge badge-none">
        <span class="dot"></span>
        <span id="statusText">없음</span>
      </div>
      <div class="last-time" id="lastTime">—</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
  let polling = null;

  function showToast(msg, duration = 3000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  function relativeTime(isoStr) {
    if (!isoStr) return '—';
    const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
    if (diff < 10)  return '방금 전';
    if (diff < 60)  return `${diff}초 전`;
    if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
    return `${Math.floor(diff / 86400)}일 전`;
  }

  function absoluteTime(isoStr) {
    if (!isoStr) return '—';
    return new Date(isoStr).toLocaleString('ko-KR', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }

  function applyStatus(data) {
    const btn   = document.getElementById('syncBtn');
    const badge = document.getElementById('statusBadge');
    const stxt  = document.getElementById('statusText');
    const ltime = document.getElementById('lastTime');
    const label = btn.querySelector('.sync-btn-label');

    if (data.is_syncing) {
      btn.disabled = true;
      btn.classList.add('syncing');
      label.textContent = '동기화 중...';
      badge.className = 'status-badge badge-syncing';
      stxt.innerHTML = '<span class="dot syncing-dot"></span> 진행 중';
    } else {
      btn.disabled = false;
      btn.classList.remove('syncing');
      label.textContent = '동기화 실행';

      if (data.status === 'success') {
        badge.className = 'status-badge badge-success';
        stxt.textContent = '성공';
      } else if (data.status === 'error') {
        badge.className = 'status-badge badge-error';
        stxt.textContent = '오류';
      } else {
        badge.className = 'status-badge badge-none';
        stxt.textContent = '없음';
      }
    }

    if (data.last_sync_time) {
      ltime.textContent = `${relativeTime(data.last_sync_time)}  (${absoluteTime(data.last_sync_time)})`;
    }
  }

  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      if (res.status === 401) { location.href = '/login'; return null; }
      return await res.json();
    } catch { return null; }
  }

  function startPolling() {
    if (polling) return;
    polling = setInterval(async () => {
      const data = await fetchStatus();
      if (!data) return;
      applyStatus(data);
      if (!data.is_syncing) stopPolling();
    }, 2000);
  }

  function stopPolling() {
    clearInterval(polling);
    polling = null;
  }

  async function triggerSync() {
    const res = await fetch('/api/sync', { method: 'POST' });
    if (res.status === 401) { location.href = '/login'; return; }

    const body = await res.json();

    if (res.status === 409) {
      showToast(body.message);
      return;
    }

    if (res.status === 202) {
      applyStatus({ is_syncing: true });
      startPolling();
    }
  }

  // Initial load
  (async () => {
    const data = await fetchStatus();
    if (!data) return;
    applyStatus(data);
    if (data.is_syncing) startPolling();
  })();

  // Refresh relative time every 30s
  setInterval(async () => {
    const data = await fetchStatus();
    if (data) applyStatus(data);
  }, 30000);
</script>
{% endif %}

</body>
</html>
